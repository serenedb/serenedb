name: serenedb | create infra

run-name: "serenedb | create infra"

on:
  workflow_dispatch:
    inputs:
      LOCATION:
        description: 'Where the build is executed'
        type: choice
        required: true
        options:
          - linux-amd64
          - linux-arm64
          - linux
        default: 'linux-amd64'
      PUSH_IMAGES_2_REGISTRY:
        description: 'Push the images the registry lacks to Docker Hub (off: build them for this runner only)'
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      REF:
        description: 'The commit whose images the registry must have'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-image:
    name: Build the missing images
    runs-on:
      - ${{ inputs.LOCATION || 'linux-amd64' }}
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true

      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || github.sha }}
          fetch-depth: 1
          submodules: false
          clean: true

      - name: Build and push the images the registry lacks
        working-directory: ./scripts/ci
        env:
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
          PUSH_IMAGES_2_REGISTRY: ${{ inputs.REF != '' || inputs.PUSH_IMAGES_2_REGISTRY }}
        run: ./build_images.sh

      - name: Send notification
        if: always() && !cancelled() && inputs.REF == ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID_MAIN: "51"
          TG_THREAD_ID_BUILD: "53"
          TG_USER_MAP: ${{ secrets.TG_USER_MAP }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_NAME: "serenedb | create infra"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send_notification.bash

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"
