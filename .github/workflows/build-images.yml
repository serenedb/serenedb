name: serenedb | create infra
run-name: "serenedb | create infra${{ inputs.TAG != '' && format(' [{0}]', inputs.TAG) || '' }}"

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'Also tag every image of this commit with this name, such as latest'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.location }}
    strategy:
      matrix:
        location: [linux-amd64, linux-arm64]
    runs-on:
      - ${{ matrix.location }}
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true

      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          clean: true

      - name: Build and push this architecture
        working-directory: ./scripts/ci
        env:
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: ./build_images.sh arch

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"

  tag:
    name: Tag the images ${{ inputs.TAG }}
    needs: build
    if: inputs.TAG != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Tag every image
        working-directory: ./scripts/ci
        env:
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
          TAG: ${{ inputs.TAG }}
        run: ./build_images.sh tag "$TAG"
