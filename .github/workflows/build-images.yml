name: serenedb | create infra
run-name: "serenedb | create infra"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      REF:
        description: 'The commit whose images the registry must have'
        type: string
        required: true

permissions:
  contents: read

jobs:
  missing:
    name: Find the images the registry lacks
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.missing.outputs.images }}
    steps:
      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: List them
        id: missing
        working-directory: ./scripts/ci
        run: |
          images=$(./build_images.sh missing | paste -sd' ')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "missing: ${images:-none}"

  build:
    name: Build ${{ matrix.location }}
    needs: missing
    if: needs.missing.outputs.images != ''
    strategy:
      matrix:
        location: [linux-amd64, linux-arm64]
    runs-on:
      - ${{ matrix.location }}
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true

      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || github.sha }}
          fetch-depth: 1
          submodules: false
          clean: true

      - name: Build and push this architecture
        working-directory: ./scripts/ci
        env:
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: ./build_images.sh arch

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"

  merge:
    name: Join the architectures
    needs: [missing, build]
    if: needs.missing.outputs.images != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Push every image under its own tag
        working-directory: ./scripts/ci
        env:
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: ./build_images.sh merge

  notify:
    name: Send notification
    needs: [missing, build, merge]
    if: always() && !cancelled() && inputs.REF == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SereneDB
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Send notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID_MAIN: "51"
          TG_THREAD_ID_BUILD: "53"
          TG_USER_MAP: ${{ secrets.TG_USER_MAP }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          ACTOR: ${{ github.actor }}
          RUN_NAME: "serenedb | create infra"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send_notification.bash
