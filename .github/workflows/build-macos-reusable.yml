name: task | serenedb macos build & test

# Native macOS (Apple Silicon) build + test. Unlike the Linux pipeline this does
# NOT use Docker: it builds with LLVM's macOS release of LLVM_VERSION and runs
# the gtests and the fast sqllogic tests with scripts/ci/test.py. Reusable +
# manually dispatchable; wired into the nightly run (jobs-schedule.yml).
on:
  workflow_call:
    inputs:
      PR_SHA:
        description: "Commit SHA to checkout (empty = workflow ref)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      PR_SHA:
        description: "Commit SHA to checkout (empty = workflow ref)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-test:
    name: "macos build & test"
    runs-on: macos-15
    timeout-minutes: 180
    env:
      LLVM_VERSION: "23.1.4"
      # ccache tuned for cross-run reuse (see below):
      #  - BASEDIR + NOHASHDIR: rewrite abs paths -> relative so hits survive
      #    checkout-path changes; the build's prefix maps keep outputs relative.
      #  - COMPILERCHECK=content: the toolchain is unpacked anew on a cache
      #    miss; hashing the compiler by content keeps the hits.
      #  - SLOPPINESS: don't invalidate on header timestamps / __DATE__/__TIME__.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines
      CCACHE_MAXSIZE: "5G"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          submodules: true
          fetch-depth: 1

      - name: Cache LLVM
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/llvm-${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-macos-arm64

      - name: Install toolchain
        run: |
          set -euo pipefail
          brew install bison flex bash ninja ccache pkg-config cmake zstd flock
          dir="$RUNNER_TOOL_CACHE/llvm-$LLVM_VERSION"
          if [[ ! -x "$dir/bin/clang++" ]]; then
            mkdir -p "$dir"
            curl -fsSL --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-macOS-ARM64.tar.zst" |
              zstd -dc --long=30 | tar -x -C "$dir" --strip-components=1
          fi
          "$dir/bin/clang++" --version
          echo "LLVM_DIR=$dir" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Set up PATH
        run: |
          {
            echo "$LLVM_DIR/bin"
            echo "/opt/homebrew/opt/bison/bin"
            echo "/opt/homebrew/opt/flex/bin"
            echo "/opt/homebrew/bin"
          } >> "$GITHUB_PATH"

      - name: Packages that generate the iceberg fixture
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/fixture-venv"
          python3 -m venv "$venv"
          grep -E '^(pyiceberg|pyarrow|fastavro)' scripts/ci/test-data-requirements.txt |
            xargs "$venv/bin/pip" install --quiet
          echo "$venv/bin" >> "$GITHUB_PATH"

      # Cache rotates every run (unique key) and restores the newest prior match,
      # so it rolls forward night to night. Nightly runs on the default branch, so
      # its cache is also visible to every other branch.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos15-${{ github.run_id }}
          restore-keys: |
            ccache-macos15-

      - name: Cache cargo (sqllogictest-rs runner)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/cargo-target
          key: cargo-sqllogictest-macos15-${{ hashFiles('third_party/sqllogictest-rs/**/Cargo.lock') }}
          restore-keys: |
            cargo-sqllogictest-macos15-

      # Mirrors the Linux CI build flags (scripts/ci/build.bash, `dev` config):
      # RelWithDebInfo + STACK debug + no LTO + ccache. macOS deltas: LLVM's
      # macOS release, SDB_STATIC=Off (no static libc), SDB_ALLOC=SYS
      # (jemalloc unused on macOS; Linux CI uses JE).
      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSDB_DEBUG_INFO=STACK \
            -DSDB_LTO=Off \
            -DCMAKE_C_COMPILER="$LLVM_DIR/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_DIR/bin/clang++" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_ASM_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
            -DSDB_UPDATE_SUBMODULES=Off \
            -DSDB_DEV=On \
            -DSDB_GTEST=On \
            -DSDB_FAULT_INJECTION=On \
            -DSDB_ALLOC=SYS \
            -DSDB_STATIC=Off \
            -DSDB_SANITIZE=

      - name: Build
        run: ninja -k 0 -C build serened serenedb-tests

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos15-${{ github.run_id }}

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Tests
        run: python3 scripts/ci/test.py --build-dir build --suite gtest --suite sqllogic --fast

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-logs-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
