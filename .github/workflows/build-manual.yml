name: serenedb | build & test

run-name: "serenedb | build & test [${{ inputs.LOCATION }}]"

on:
  workflow_dispatch:
    inputs:
      LOCATION:
        description: 'linux-amd64 = arm64 builds without tests; all = arm64 tests too'
        type: choice
        required: true
        default: 'linux-amd64'
        options:
          - linux-amd64
          - all
      EVERYTHING:
        description: 'Run every suite, regardless of the diff'
        type: boolean
        default: false
      BIGLAKE:
        description: 'Also run sqllogic + recovery + stress against the real BigLake catalog in dev (needs the BIGLAKE_* secrets)'
        type: boolean
        default: false
      PR_SHA:
        description: 'Exact commit SHA to build (fork PR support; empty = ref)'
        type: string
        required: false
        default: ''
      PR_NUMBER:
        description: 'Internal: PR number; scopes concurrency so fork PRs (which dispatch on the base ref) do not cancel each other'
        type: string
        required: false
        default: ''
      BUILD_CONFIG:
        description: 'Internal: PR metadata (set by trigger bot)'
        type: string
        required: false
        default: '{}'

permissions:
  statuses: write
  contents: read
  pull-requests: write

concurrency:
  group: build-manual-${{ inputs.PR_NUMBER && format('pr-{0}', inputs.PR_NUMBER) || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      test_args: ${{ steps.select.outputs.test_args }}
      pg_tests: ${{ steps.classify.outputs.pg_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 0
      - name: Every gitlink can be fetched
        run: ./scripts/ci/check_gitlinks.sh
      - id: classify
        run: ./scripts/ci/classify-changes.sh origin/main
      - id: select
        env:
          EVERYTHING: ${{ inputs.EVERYTHING }}
          IRESEARCH: ${{ steps.classify.outputs.iresearch }}
          RE2: ${{ steps.classify.outputs.re2 }}
          DUCKDB_SUITES: ${{ steps.classify.outputs.duckdb_suites }}
        run: echo "test_args=$(./scripts/ci/select_suites.sh)" >> "$GITHUB_OUTPUT"

  perf:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: perf
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  dev:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: dev
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  asan:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: asan
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  tsan:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: tsan
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  msan:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: msan
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  perf-arm64:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: perf
      LOCATION: linux-arm64
      TESTS: ${{ inputs.LOCATION == 'all' }}
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  dev-arm64:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: dev
      LOCATION: linux-arm64
      TESTS: ${{ inputs.LOCATION == 'all' }}
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  biglake:
    needs: [prepare, dev]
    if: inputs.BIGLAKE
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: dev
      TEST_ARGS: --biglake --suite sqllogic --suite recovery --suite stress --stress-profile biglake-reindex-smoke
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
    secrets: inherit

  validate-pg:
    name: validate pg
    needs: prepare
    if: ${{ !cancelled() && (inputs.EVERYTHING || needs.prepare.outputs.pg_tests != '') }}
    uses: ./.github/workflows/validate-pg-tests.yml
    with:
      LOCATION: linux-amd64
      PR_SHA: ${{ inputs.PR_SHA }}
      BUILD_IMAGE: ${{ contains(inputs.BUILD_CONFIG, 'BUILD_IMAGE') && fromJSON(inputs.BUILD_CONFIG).BUILD_IMAGE || '' }}
      PG_TESTS: ${{ inputs.EVERYTHING && '' || needs.prepare.outputs.pg_tests }}
    secrets: inherit

  report:
    name: Report Status
    needs: [prepare, perf, dev, asan, tsan, msan, perf-arm64, dev-arm64, biglake, validate-pg]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the report scripts)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Fetch the results
        uses: actions/download-artifact@v7
        with:
          pattern: results-*
          path: results
      - name: Write the report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ contains(inputs.BUILD_CONFIG, 'PR_SHA') && inputs.PR_NUMBER || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/report.py --results results --out report.md
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            report.md
            report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Send notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID_MAIN: "51"
          TG_THREAD_ID_BUILD: "53"
          TG_USER_MAP: ${{ secrets.TG_USER_MAP }}
          BRANCH: ${{ contains(inputs.BUILD_CONFIG, 'PR_BRANCH') && fromJSON(inputs.BUILD_CONFIG).PR_BRANCH || github.ref_name }}
          JOB_STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          ACTOR: ${{ contains(inputs.BUILD_CONFIG, 'TRIGGERED_BY') && fromJSON(inputs.BUILD_CONFIG).TRIGGERED_BY || github.actor }}
          RUN_NAME: "serenedb | build & test [${{ inputs.LOCATION }}]"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send_notification.bash
      - name: Update PR commit status
        if: contains(inputs.BUILD_CONFIG, 'PR_SHA')
        uses: actions/github-script@v8
        env:
          BUILD_CONFIG: ${{ inputs.BUILD_CONFIG }}
          JOB_STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        with:
          script: |
            const config = JSON.parse(process.env.BUILD_CONFIG);
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: config.PR_SHA,
              state,
              description: state === 'success' ? 'All checks passed' : 'Some checks failed',
              context: config.PR_STATUS_CONTEXT || 'serenedb | build & test',
              target_url: runUrl,
            });
