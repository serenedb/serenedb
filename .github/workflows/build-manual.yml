name: serenedb | build & test

run-name: "serenedb | build & test [${{ inputs.LOCATION }}]"

on:
  workflow_dispatch:
    inputs:
      LOCATION:
        description: 'linux-amd64 = arm64 builds without tests; all = arm64 tests too; dev-only = the amd64 dev config alone, reported as "serenedb | dev only", never the merge check'
        type: choice
        required: true
        default: 'linux-amd64'
        options:
          - linux-amd64
          - all
          - dev-only
      EVERYTHING:
        description: 'Ignore the diff: run everything'
        type: boolean
        default: false
      BUGFIX:
        description: 'Bugfix check: the changed tests must fail on the merge base'
        type: boolean
        default: false
      CORPUS:
        description: 'Also run the sqlite corpus (tests/sqllogic/any/pg/sqlite)'
        type: boolean
        default: false
      BIGLAKE:
        description: 'Also run sqllogic + recovery + stress against the real BigLake catalog in dev (needs the BIGLAKE_* secrets)'
        type: boolean
        default: false
      DUCKDB_SANITIZERS:
        description: "Also run the DuckDB suites the diff opens in asan, tsan and msan (they always run in dev)"
        type: boolean
        default: false
      IRESEARCH_SANITIZERS:
        description: 'Also run the iresearch tests the diff opens in asan, tsan and msan (they always run in dev)'
        type: boolean
        default: false
      PR_SHA:
        description: 'Exact commit SHA to build (fork PR support; empty = ref)'
        type: string
        required: false
        default: ''
      PR_NUMBER:
        description: 'Internal: PR number; scopes concurrency so fork PRs (which dispatch on the base ref) do not cancel each other'
        type: string
        required: false
        default: ''
      BUILD_CONFIG:
        description: 'Internal: PR metadata (set by trigger bot); FLAKY_RUNS runs the changed tests that many times in every config'
        type: string
        required: false
        default: '{}'

permissions:
  statuses: write
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: build-manual-${{ inputs.PR_NUMBER && format('pr-{0}', inputs.PR_NUMBER) || github.run_id }}
  cancel-in-progress: true

env:
  SDB_STORE_HOST: ${{ secrets.SDB_STORE_HOST }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      test_args: ${{ steps.select.outputs.test_args }}
      perf_test_args: ${{ steps.select.outputs.perf_test_args }}
      sanitizer_test_args: ${{ steps.select.outputs.sanitizer_test_args }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 0
      - name: pre-commit is not red
        if: inputs.PR_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ci.py wait-check --repo "${{ github.repository }}" --sha "${{ inputs.PR_SHA }}" --name pre-commit
      - id: classify
        run: ./scripts/ci/classify-changes.sh origin/main
      - id: select
        env:
          EVERYTHING: ${{ inputs.EVERYTHING }}
          ALL_SUITES: ${{ steps.classify.outputs.everything }}
          PG: ${{ steps.classify.outputs.pg }}
          IRESEARCH: ${{ steps.classify.outputs.iresearch }}
          RE2: ${{ steps.classify.outputs.re2 }}
          DUCKDB_SUITES: ${{ steps.classify.outputs.duckdb_suites }}
          CORPUS: ${{ inputs.CORPUS }}
          DUCKDB_SANITIZERS: ${{ inputs.DUCKDB_SANITIZERS }}
          IRESEARCH_SANITIZERS: ${{ inputs.IRESEARCH_SANITIZERS }}
          BUILD_CONFIG: ${{ inputs.BUILD_CONFIG }}
        run: |
          args=(--duckdb-suites "$DUCKDB_SUITES")
          [[ "$EVERYTHING" != true ]] || args+=(--everything)
          [[ "$CORPUS" != true ]] || args+=(--corpus)
          [[ "$RE2" != true ]] || args+=(--re2)
          sanitizer=("${args[@]}")
          [[ "$IRESEARCH" != true ]] || args+=(--iresearch)
          [[ "$IRESEARCH" != true || "$IRESEARCH_SANITIZERS" != true ]] || sanitizer+=(--iresearch)
          [[ "$DUCKDB_SANITIZERS" == true ]] || sanitizer+=(--no-duckdb)
          runs=$(python3 -c 'import json, os; print(int(json.loads(os.environ["BUILD_CONFIG"] or "{}").get("FLAKY_RUNS", 1)))')
          flaky=""
          if ((runs > 1)); then
            flaky="--changed origin/main --repeat $((runs - 1))"
          fi
          perf=("${args[@]}")
          if [[ "$EVERYTHING" == true || "$ALL_SUITES" == true ]]; then
            perf+=(--postgres all)
          elif [[ "$PG" == true ]]; then
            perf+=(--postgres changed)
          fi
          {
            echo "test_args=$(python3 scripts/ci/ci.py select-suites "${args[@]}") $flaky"
            echo "perf_test_args=$(python3 scripts/ci/ci.py select-suites "${perf[@]}") $flaky"
            echo "sanitizer_test_args=$(python3 scripts/ci/ci.py select-suites "${sanitizer[@]}") $flaky"
          } >> "$GITHUB_OUTPUT"

  perf:
    needs: prepare
    if: inputs.LOCATION != 'dev-only'
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: perf
      TEST_ARGS: ${{ needs.prepare.outputs.perf_test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  dev:
    needs: prepare
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: dev
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      BIGLAKE_TEST_ARGS: ${{ inputs.BIGLAKE && '--biglake --suite sqllogic --suite recovery --suite stress --stress-profile biglake-reindex-smoke' || '' }}
      COVERAGE: true
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  asan:
    needs: prepare
    if: inputs.LOCATION != 'dev-only'
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: asan
      TEST_ARGS: ${{ needs.prepare.outputs.sanitizer_test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  tsan:
    needs: prepare
    if: inputs.LOCATION != 'dev-only'
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: tsan
      TEST_ARGS: ${{ needs.prepare.outputs.sanitizer_test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  msan:
    needs: prepare
    if: inputs.LOCATION != 'dev-only'
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: msan
      TEST_ARGS: ${{ needs.prepare.outputs.sanitizer_test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  perf-arm64:
    needs: prepare
    if: inputs.LOCATION != 'dev-only'
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: perf
      LOCATION: linux-arm64
      TESTS: ${{ inputs.LOCATION == 'all' }}
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  dev-arm64:
    needs: prepare
    if: inputs.LOCATION != 'dev-only'
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: dev
      LOCATION: linux-arm64
      TESTS: ${{ inputs.LOCATION == 'all' }}
      TEST_ARGS: ${{ needs.prepare.outputs.test_args }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  coverage:
    name: coverage dev (linux-amd64)
    needs: dev
    if: ${{ !cancelled() && needs.dev.outputs.remote == 'true' }}
    runs-on:
      - linux-amd64
      - lan
    timeout-minutes: 60
    env:
      SDB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SDB_SHA: ${{ inputs.PR_SHA || github.sha }}
      SDB_PR: ${{ inputs.PR_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: true
          clean: false

      - name: Clean the checkout
        run: |
          git config --global --add safe.directory '*'
          docker run --rm ${SDB_DOCKER_OWNER:+--label "serenedb.owner=$SDB_DOCKER_OWNER"} -v "$PWD:/w" alpine:3.22 rm -rf /w/out
          git clean -ffdxq
          git submodule foreach --quiet --recursive 'git clean -ffdxq'
          git fetch -q --no-tags --depth=1000 origin main "$(git rev-parse HEAD)"

      - name: Coverage of the change
        env:
          RUNS: ${{ needs.dev.outputs.runs }}
        run: |
          python3 scripts/ci/ci.py coverage-report --config dev --digest "${{ needs.dev.outputs.digest }}" \
            --run "$SDB_RUN_ID" --base origin/main \
            --shards "$(python3 -c 'import json, os; print(sum(not r["check"] for r in json.loads(os.environ["RUNS"]).values()))')"
          cat out/coverage-*/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dev-linux-amd64
          path: |
            out/coverage-*/summary.txt
            out/coverage-*/coverage.json
          if-no-files-found: ignore
          retention-days: 30

  bugfix:
    name: bugfix check
    needs: prepare
    if: inputs.BUGFIX && inputs.LOCATION != 'dev-only'
    runs-on:
      - linux-amd64
    timeout-minutes: 240
    env:
      SDB_STORE_RESULTS: "false"
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true
          git config --global --add safe.directory '*'
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: true
          clean: false
      - name: Clean the checkout
        run: |
          docker run --rm ${SDB_DOCKER_OWNER:+--label "serenedb.owner=$SDB_DOCKER_OWNER"} -v "$PWD:/w" alpine:3.22 rm -rf /w/out
          git clean -ffdxq
          git submodule foreach --quiet --recursive 'git clean -ffdxq'
      - name: Build and push the images this architecture lacks
        working-directory: ./scripts/ci
        env:
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: ./build_images.sh arch
      - name: The changed tests fail without the fix
        run: ./scripts/ci/bugfix_check.sh origin/main
      - name: Summary
        if: always()
        run: cat out/test-*/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-bugfix
          path: |
            out/test-*/results.jsonl
            out/test-*/summary.txt
            out/test-*/meta.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"

  report:
    name: Report Status
    needs: [prepare, perf, dev, asan, tsan, msan, perf-arm64, dev-arm64, coverage, bugfix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the report scripts)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Fetch the results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - name: Fetch the coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Write the report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ contains(inputs.BUILD_CONFIG, 'PR_SHA') && inputs.PR_NUMBER || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_SHA: ${{ inputs.PR_SHA || github.sha }}
          REPORT_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/ci/report.py --results results --coverage coverage --out report.md
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            report.md
            report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Send notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID_MAIN: "51"
          TG_THREAD_ID_BUILD: "53"
          TG_USER_MAP: ${{ secrets.TG_USER_MAP }}
          BRANCH: ${{ contains(inputs.BUILD_CONFIG, 'PR_BRANCH') && fromJSON(inputs.BUILD_CONFIG).PR_BRANCH || github.ref_name }}
          JOB_STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          ACTOR: ${{ contains(inputs.BUILD_CONFIG, 'TRIGGERED_BY') && fromJSON(inputs.BUILD_CONFIG).TRIGGERED_BY || github.actor }}
          RUN_NAME: "serenedb | build & test [${{ inputs.LOCATION }}]"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send_notification.bash
      - name: Update PR commit status
        if: contains(inputs.BUILD_CONFIG, 'PR_SHA')
        uses: actions/github-script@v9
        env:
          BUILD_CONFIG: ${{ inputs.BUILD_CONFIG }}
          JOB_STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        with:
          script: |
            const config = JSON.parse(process.env.BUILD_CONFIG);
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: config.PR_SHA,
              state,
              description: state === 'success' ? 'All checks passed' : 'Some checks failed',
              context: config.PR_STATUS_CONTEXT || 'serenedb | build & test',
              target_url: runUrl,
            });
