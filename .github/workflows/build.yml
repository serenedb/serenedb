name: task | serenedb build

on:
  workflow_call:
    inputs:
      CONFIG:
        description: "perf, dev, asan, tsan or msan (scripts/ci/config.sh)"
        type: string
        required: true
      LOCATION:
        description: "Runner label"
        type: string
        required: false
        default: "linux-amd64"
      TESTS:
        description: "Test the build: this job runs a single shard itself, more go to test jobs"
        type: boolean
        required: false
        default: false
      TEST_ARGS:
        description: "Extra scripts/ci/test.py arguments (suite selection, budgets)"
        type: string
        required: false
        default: ""
      BIGLAKE_TEST_ARGS:
        description: "scripts/ci/test.py arguments of the biglake check, a second test run on this build"
        type: string
        required: false
        default: ""
      COVERAGE:
        description: "Report the coverage of the change here when this job runs the tests itself"
        type: boolean
        required: false
        default: false
      PR_SHA:
        description: "Commit SHA to check out (empty = workflow ref)"
        type: string
        required: false
        default: ""
      PR_NUMBER:
        description: "PR number, recorded with the results"
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: "Input digest of the build"
        value: ${{ jobs.build.outputs.digest }}
      remote:
        description: "true when test jobs run the tests, on the bundle this job published"
        value: ${{ jobs.build.outputs.remote }}
      shards:
        description: "The names of the test runs the test jobs run, as JSON"
        value: ${{ jobs.build.outputs.shards }}
      runs:
        description: "Each test run's shard, plan and check, by name, as JSON"
        value: ${{ jobs.build.outputs.runs }}

env:
  SDB_STORE_HOST: ${{ secrets.SDB_STORE_HOST }}
  SDB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  SDB_SHA: ${{ inputs.PR_SHA || github.sha }}
  SDB_PR: ${{ inputs.PR_NUMBER }}
  SDB_BRANCH: ${{ inputs.PR_NUMBER == '' && github.ref_name || '' }}

jobs:
  build:
    name: build ${{ inputs.CONFIG }} (${{ inputs.LOCATION }})
    runs-on:
      - ${{ inputs.LOCATION }}
    timeout-minutes: 660
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      remote: ${{ steps.plan.outputs.remote }}
      shards: ${{ steps.plan.outputs.shards }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: true
          clean: false

      - name: Clean the checkout
        run: |
          docker run --rm ${SDB_DOCKER_OWNER:+--label "serenedb.owner=$SDB_DOCKER_OWNER"} -v "$PWD:/w" alpine:3.22 rm -rf /w/out
          git clean -ffdxq
          git submodule foreach --quiet --recursive 'git clean -ffdxq'
          git fetch -q --no-tags --depth=1000 origin main "$(git rev-parse HEAD)"

      - name: Build
        id: build
        run: |
          set -f
          ./scripts/ci/build_bundle.sh "${{ inputs.CONFIG }}" ${{ inputs.TEST_ARGS }}

      - name: Plan the tests, and publish the bundle when test jobs run them
        id: plan
        if: inputs.TESTS
        env:
          BIGLAKE_TEST_ARGS: ${{ inputs.BIGLAKE_TEST_ARGS }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCATION: ${{ inputs.LOCATION }}
        run: |
          set -f
          source scripts/ci/config.sh
          sdb_config "${{ inputs.CONFIG }}"
          python3 scripts/ci/ci.py timing --config "$CONFIG" --arch "$ARCH" --out out/timing.json
          bundle=$(python3 scripts/ci/ci.py fetch --config "$CONFIG" --arch "$ARCH" --digest "$DIGEST")
          plan() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -w "$PWD" -v "$bundle:$bundle" "$BUILD_IMAGE" \
              python3 scripts/ci/ci.py shards --build-dir "$bundle" --config "$CONFIG" \
                --timing out/timing.json --cpus "$(nproc)" "$@"
          }
          lists=("$(plan -- ${{ inputs.TEST_ARGS }})")
          if [[ -n "$BIGLAKE_TEST_ARGS" ]]; then
            read -ra biglake_args <<< "$BIGLAKE_TEST_ARGS"
            lists+=("$(plan --check biglake -- "${biglake_args[@]}")")
          fi
          python3 scripts/ci/ci.py runs "${lists[@]}" --tsv out/runs.tsv | tee -a "$GITHUB_OUTPUT" out/runs.env
          if grep -qx remote=true out/runs.env; then
            python3 scripts/ci/ci.py publish --config "$CONFIG" --arch "$ARCH" --digest "$DIGEST"
            python3 scripts/ci/ci.py upload out/timing.json "artifacts/timing-$CONFIG-$LOCATION/$SDB_RUN_ID/timing.json"
          fi

      - name: Run the tests
        id: tests
        if: steps.plan.outputs.remote == 'false'
        env:
          COVERAGE: ${{ inputs.COVERAGE }}
          BIGLAKE_TEST_ARGS: ${{ inputs.BIGLAKE_TEST_ARGS }}
          SEARCHBENCH_S3_KEY_ID: ${{ secrets.SEARCHBENCH_S3_KEY_ID }}
          SEARCHBENCH_S3_SECRET: ${{ secrets.SEARCHBENCH_S3_SECRET }}
          BIGLAKE_PROJECT: ${{ secrets.BIGLAKE_PROJECT }}
          BIGLAKE_CATALOG: ${{ secrets.BIGLAKE_CATALOG }}
          BIGLAKE_CLIENT_EMAIL: ${{ secrets.BIGLAKE_CLIENT_EMAIL }}
          BIGLAKE_PRIVATE_KEY: ${{ secrets.BIGLAKE_PRIVATE_KEY }}
          BIGLAKE_PRIVATE_KEY_ID: ${{ secrets.BIGLAKE_PRIVATE_KEY_ID }}
        run: |
          set -f
          read -ra biglake_args <<< "$BIGLAKE_TEST_ARGS"
          rc=0
          while IFS=$'\t' read -r name spec plan check; do
            if [[ "$check" == biglake ]]; then
              args=("${biglake_args[@]}")
            else
              args=(${{ inputs.TEST_ARGS }})
            fi
            echo "::group::$name"
            SDB_CHECK="$check" ./scripts/ci/run_shard.sh "${{ inputs.CONFIG }}" "${{ steps.build.outputs.digest }}" \
              "$spec" out/timing.json --budget 19800 --plan "$plan" "${args[@]}" || rc=1
            echo "::endgroup::"
          done < out/runs.tsv
          if [[ "$COVERAGE" == true ]]; then
            python3 scripts/ci/ci.py coverage-report --config "${{ inputs.CONFIG }}" \
              --digest "${{ steps.build.outputs.digest }}" --run "$SDB_RUN_ID" --base origin/main --shards 1 || rc=1
            cat out/coverage-*/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          cat out/test-*/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit $rc

      - name: Upload the results
        if: ${{ always() && steps.tests.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}
          path: |
            out/test-*/results.jsonl
            out/test-*/summary.txt
            out/test-*/meta.json
            out/coverage-*/summary.txt
            out/coverage-*/coverage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}
          path: |
            out/failure-*.tar.zst
            out/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"
