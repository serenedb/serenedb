name: task | serenedb config

on:
  workflow_call:
    inputs:
      CONFIG:
        description: "perf, dev, asan, tsan or msan (scripts/ci/config.sh)"
        type: string
        required: true
      LOCATION:
        description: "Runner label"
        type: string
        required: false
        default: "linux-amd64"
      TESTS:
        description: "Run the tests after the build"
        type: boolean
        required: false
        default: true
      TEST_ARGS:
        description: "Extra scripts/ci/test.py arguments (suite selection, budgets)"
        type: string
        required: false
        default: ""
      PR_SHA:
        description: "Commit SHA to check out (empty = workflow ref)"
        type: string
        required: false
        default: ""
      PR_NUMBER:
        description: "PR number, recorded with the results"
        type: string
        required: false
        default: ""
      BUILD_IMAGE:
        description: "Build image (empty = the one scripts/ci/build-image.txt pins)"
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: "Input digest of the build"
        value: ${{ jobs.build.outputs.digest }}

env:
  BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}
  SDB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  SDB_SHA: ${{ inputs.PR_SHA || github.sha }}
  SDB_PR: ${{ inputs.PR_NUMBER }}

jobs:
  build:
    name: build ${{ inputs.CONFIG }} (${{ inputs.LOCATION }})
    runs-on:
      - ${{ inputs.LOCATION }}
    timeout-minutes: 300
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: true
          clean: false

      - name: Clean the checkout, keeping the build directories
        run: |
          git clean -ffdxq -e '/build_*/'
          git submodule foreach --quiet --recursive 'git clean -ffdxq'
          git fetch -q --no-tags --depth=1000 origin main "$(git rev-parse HEAD)"

      - name: Build
        id: build
        run: ./scripts/ci/build_bundle.sh "${{ inputs.CONFIG }}"

      - name: Plan the test shards
        id: plan
        if: inputs.TESTS
        run: |
          set -f
          source scripts/ci/config.sh
          sdb_config "${{ inputs.CONFIG }}"
          python3 scripts/ci/ci.py timing --config "$CONFIG" --arch "$ARCH" --out out/timing.json
          bundle=$(python3 scripts/ci/ci.py fetch --config "$CONFIG" --arch "$ARCH" --digest "${{ steps.build.outputs.digest }}")
          shards=$(docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:$PWD" -w "$PWD" -v "$bundle:$bundle" "$BUILD_IMAGE" \
            python3 scripts/ci/ci.py shards --build-dir "$bundle" --config "$CONFIG" \
              --timing out/timing.json --cpus "$(nproc)" -- ${{ inputs.TEST_ARGS }})
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shards: $shards"

      - name: Keep the timing snapshot for the shards
        if: inputs.TESTS
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}
          path: out/timing.json
          retention-days: 3

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}
          path: out/logs/
          retention-days: 14

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"

  test:
    name: test ${{ inputs.CONFIG }} ${{ matrix.shard.name }} (${{ inputs.LOCATION }})
    needs: build
    if: inputs.TESTS
    runs-on:
      - ${{ inputs.LOCATION }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: true
          clean: false

      - name: Clean the checkout, keeping the build directories
        run: |
          git clean -ffdxq -e '/build_*/'
          git submodule foreach --quiet --recursive 'git clean -ffdxq'
          git fetch -q --no-tags --depth=1000 origin main "$(git rev-parse HEAD)"

      - name: Check out the sqlite corpus
        run: git submodule update --init --checkout --depth=1 tests/sqllogic/any/pg/sqlite

      - name: Fetch the timing snapshot
        uses: actions/download-artifact@v7
        with:
          name: timing-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}
          path: out

      - name: Run the shard
        env:
          SEARCHBENCH_S3_KEY_ID: ${{ secrets.SEARCHBENCH_S3_KEY_ID }}
          SEARCHBENCH_S3_SECRET: ${{ secrets.SEARCHBENCH_S3_SECRET }}
          BIGLAKE_PROJECT: ${{ secrets.BIGLAKE_PROJECT }}
          BIGLAKE_CATALOG: ${{ secrets.BIGLAKE_CATALOG }}
          BIGLAKE_CLIENT_EMAIL: ${{ secrets.BIGLAKE_CLIENT_EMAIL }}
          BIGLAKE_PRIVATE_KEY: ${{ secrets.BIGLAKE_PRIVATE_KEY }}
          BIGLAKE_PRIVATE_KEY_ID: ${{ secrets.BIGLAKE_PRIVATE_KEY_ID }}
        run: |
          set -f
          ./scripts/ci/run_shard.sh "${{ inputs.CONFIG }}" "${{ needs.build.outputs.digest }}" \
            "${{ matrix.shard.spec }}" out/timing.json ${{ inputs.TEST_ARGS }}

      - name: Summary
        if: always()
        run: cat out/test-*/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}-${{ matrix.shard.name }}
          path: |
            out/test-*/results.jsonl
            out/test-*/summary.txt
            out/test-*/meta.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}-${{ matrix.shard.name }}
          path: out/failure-*.tar.zst
          if-no-files-found: ignore
          retention-days: 14

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"

  coverage:
    name: coverage ${{ inputs.CONFIG }} (${{ inputs.LOCATION }})
    needs: [build, test]
    if: ${{ !cancelled() && inputs.TESTS && inputs.CONFIG == 'dev' && needs.build.result == 'success' }}
    runs-on:
      - ${{ inputs.LOCATION }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: true
          clean: false

      - name: Clean the checkout, keeping the build directories
        run: |
          git config --global --add safe.directory '*'
          git clean -ffdxq -e '/build_*/'
          git submodule foreach --quiet --recursive 'git clean -ffdxq'
          git fetch -q --no-tags --depth=1000 origin main "$(git rev-parse HEAD)"

      - name: Coverage of the change
        run: |
          ./scripts/ci/coverage_report.sh "${{ inputs.CONFIG }}" "${{ needs.build.outputs.digest }}" \
            "$SDB_RUN_ID" origin/main
          cat out/coverage-*/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.CONFIG }}-${{ inputs.LOCATION }}
          path: |
            out/coverage-*/summary.txt
            out/coverage-*/coverage.json
          if-no-files-found: ignore
          retention-days: 30
