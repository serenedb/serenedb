name: task | serenedb config

on:
  workflow_call:
    inputs:
      CONFIG:
        description: "perf, dev, asan, tsan or msan (scripts/ci/config.sh)"
        type: string
        required: true
      LOCATION:
        description: "Runner label"
        type: string
        required: false
        default: "linux-amd64"
      TESTS:
        description: "Run the tests after the build"
        type: boolean
        required: false
        default: true
      TEST_ARGS:
        description: "Extra scripts/ci/test.py arguments (suite selection, budgets)"
        type: string
        required: false
        default: ""
      BIGLAKE_TEST_ARGS:
        description: "scripts/ci/test.py arguments of the biglake check, run on this build beside its tests against the real BigLake catalog (needs the BIGLAKE_* secrets)"
        type: string
        required: false
        default: ""
      COVERAGE:
        description: "Report the coverage of the change; the build job does when it runs the tests itself"
        type: boolean
        required: false
        default: false
      PR_SHA:
        description: "Commit SHA to check out (empty = workflow ref)"
        type: string
        required: false
        default: ""
      PR_NUMBER:
        description: "PR number, recorded with the results"
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: "Input digest of the build"
        value: ${{ jobs.build.outputs.digest }}
      remote:
        description: "true when test jobs ran the tests"
        value: ${{ jobs.build.outputs.remote }}
      runs:
        description: "Each test run's shard, plan and check, by name, as JSON"
        value: ${{ jobs.build.outputs.runs }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      CONFIG: ${{ inputs.CONFIG }}
      LOCATION: ${{ inputs.LOCATION }}
      TESTS: ${{ inputs.TESTS }}
      TEST_ARGS: ${{ inputs.TEST_ARGS }}
      BIGLAKE_TEST_ARGS: ${{ inputs.BIGLAKE_TEST_ARGS }}
      COVERAGE: ${{ inputs.COVERAGE }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit

  test:
    needs: build
    if: needs.build.outputs.remote == 'true'
    uses: ./.github/workflows/test.yml
    with:
      CONFIG: ${{ inputs.CONFIG }}
      LOCATION: ${{ inputs.LOCATION }}
      DIGEST: ${{ needs.build.outputs.digest }}
      SHARDS: ${{ needs.build.outputs.shards }}
      RUNS: ${{ needs.build.outputs.runs }}
      TEST_ARGS: ${{ inputs.TEST_ARGS }}
      BIGLAKE_TEST_ARGS: ${{ inputs.BIGLAKE_TEST_ARGS }}
      PR_SHA: ${{ inputs.PR_SHA }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
    secrets: inherit
