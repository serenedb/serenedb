name: serenedb | nightly

run-name: "serenedb | nightly [${{ (github.event_name == 'schedule' || inputs.PUBLISH) && 'publish' || 'no publish' }}]"

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      PUBLISH:
        description: 'When everything is green: replace the draft release and push the images (version and nightly tags)'
        type: boolean
        default: false
      CORPUS:
        description: 'Also run the sqlite corpus (tests/sqllogic/any/pg/sqlite)'
        type: boolean
        default: false

permissions:
  statuses: write
  contents: write
  pull-requests: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  SDB_STORE_HOST: ${{ secrets.SDB_STORE_HOST }}

jobs:
  perf:
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: perf
      TEST_ARGS: --stress-profile soak --postgres all ${{ inputs.CORPUS && '--corpus' || '' }}
    secrets: inherit

  dev:
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: dev
      TEST_ARGS: --stress-profile soak ${{ inputs.CORPUS && '--corpus' || '' }}
    secrets: inherit

  asan:
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: asan
      TEST_ARGS: --stress-profile soak ${{ inputs.CORPUS && '--corpus' || '' }}
    secrets: inherit

  tsan:
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: tsan
      TEST_ARGS: --stress-profile soak-tsan ${{ inputs.CORPUS && '--corpus' || '' }}
    secrets: inherit

  msan:
    uses: ./.github/workflows/config.yml
    with:
      CONFIG: msan
      TEST_ARGS: --stress-profile soak ${{ inputs.CORPUS && '--corpus' || '' }}
    secrets: inherit

  perf-arm64:
    uses: ./.github/workflows/build.yml
    with:
      CONFIG: perf
      LOCATION: linux-arm64
    secrets: inherit

  dev-arm64:
    uses: ./.github/workflows/build.yml
    with:
      CONFIG: dev
      LOCATION: linux-arm64
    secrets: inherit

  macos:
    uses: ./.github/workflows/build-macos-reusable.yml

  release:
    needs: [perf, dev, asan, tsan, msan, perf-arm64, dev-arm64, macos]
    uses: ./.github/workflows/release.yml
    with:
      RTA: required
      PUSH_IMAGES_2_REGISTRY: ${{ github.event_name == 'schedule' || inputs.PUBLISH }}
      CREATE_GITHUB_RELEASE: ${{ github.event_name == 'schedule' || inputs.PUBLISH }}
      DOCKER_EXTRA_TAGS: ${{ (github.event_name == 'schedule' || inputs.PUBLISH) && 'nightly' || '' }}
    secrets: inherit

  timing:
    name: learn the timings
    needs: [perf, dev, asan, tsan, msan]
    if: ${{ !cancelled() }}
    runs-on:
      - linux-amd64
      - lan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: false
      - name: Update the timing store
        run: |
          for config in perf dev asan tsan msan; do
            python3 scripts/ci/ci.py update-timing --config "$config" --arch x86_64
          done

  report:
    name: Report Status
    needs: [perf, dev, asan, tsan, msan, perf-arm64, dev-arm64, macos, release, timing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Fetch the results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - name: Write the report
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/report.py --results results --out report.md
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            report.md
            report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Send notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID_MAIN: "51"
          TG_THREAD_ID_BUILD: "53"
          TG_USER_MAP: ${{ secrets.TG_USER_MAP }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          ACTOR: ${{ github.event_name == 'schedule' && 'scheduled' || github.actor }}
          RUN_NAME: "serenedb | nightly"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send_notification.bash
