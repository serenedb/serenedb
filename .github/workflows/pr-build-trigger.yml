name: auto | pr trigger

on:
  pull_request_target:
    types: [opened, labeled]
  issue_comment:
    types: [edited]

concurrency:
  group: pr-build-trigger-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handle:
    if: >-
      (github.event_name == 'pull_request_target' && (
        github.event.action == 'opened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'spawn-build-bot')
      )) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'github-actions[bot]' &&
        contains(github.event.comment.body, '<!-- serenedb-ci-trigger -->') &&
        contains(github.event.comment.body, '- [x] **Trigger Jobs**')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Post build triggers comment
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              '<!-- serenedb-ci-trigger -->',
              '### CI Triggers',
              '_Check **Trigger Jobs** to start. Optionally enable extra checks below._',
              '',
              '#### Extra (optional; every config runs the suites the diff selects, the sanitizers without DuckDB\'s and iresearch\'s)',
              '- [ ] Dev only (the amd64 dev config alone; reports as "serenedb | dev only", which is not the merge check)',
              '- [ ] All architectures (arm64 tests too; arm64 always builds)',
              '- [ ] Ignore diff, run everything',
              '- [ ] DuckDB sanitizers (the DuckDB suites the diff selects in asan, tsan and msan too)',
              '- [ ] iresearch sanitizers (the iresearch tests the diff selects in asan, tsan and msan too)',
              '- [ ] Bugfix check (the changed tests must fail on the merge base)',
              '- [ ] sqlite corpus (tests/sqllogic/any/pg/sqlite)',
              '- [ ] BigLake tests (sqllogic + recovery + stress against the real catalog)',
              '- Flaky check runs: 1 (the tests the diff changes run this many times in every config; any failing run makes the test flaky)',
              '',
              '---',
              '- [ ] **Trigger Jobs**',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            if (!comments.some(c => (c.body || '').startsWith('<!-- serenedb-ci-report -->'))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: '<!-- serenedb-ci-report -->\n### CI results\n\nNo run yet: check **Trigger Jobs** in the comment below.',
              });
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

            if (context.payload.action === 'labeled') {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'spawn-build-bot',
              }).catch(() => {});
            }

      - name: Get PR info
        id: pr-info
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('is_fork', (pr.head.repo.full_name !== pr.base.repo.full_name).toString());

      - name: Parse options and trigger build
        if: steps.pr-info.conclusion == 'success'
        env:
          PR_BRANCH: ${{ steps.pr-info.outputs.branch }}
          PR_SHA: ${{ steps.pr-info.outputs.sha }}
          BASE_REF: ${{ steps.pr-info.outputs.base_ref }}
          IS_FORK: ${{ steps.pr-info.outputs.is_fork }}
        uses: actions/github-script@v9
        with:
          script: |
            const comment = context.payload.comment;
            const body = comment.body || '';
            const branch = process.env.PR_BRANCH;
            const sha = process.env.PR_SHA;
            const baseRef = process.env.BASE_REF;
            const isFork = process.env.IS_FORK === 'true';
            const dispatchRef = isFork ? baseRef : branch;

            const isChecked = (label) => body.includes(`- [x] ${label}`);

            const allArch = isChecked('All architectures');
            const everything = isChecked('Ignore diff, run everything');
            const bugfix = isChecked('Bugfix check');
            const corpus = isChecked('sqlite corpus');
            const biglake = isChecked('BigLake tests');
            const duckdbSanitizers = isChecked('DuckDB sanitizers');
            const iresearchSanitizers = isChecked('iresearch sanitizers');
            const devOnly = isChecked('Dev only');
            const flakyRuns = Math.min(10, Math.max(1, Number(body.match(/Flaky check runs:\s*(\d+)/)?.[1] ?? 1)));

            const { owner, repo } = context.repo;
            const statusContext = devOnly ? 'serenedb | dev only' : 'serenedb | build & test';

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              description: 'Build queued',
              context: statusContext,
            });

            // A superseding run is cancelled by build-manual's per-PR concurrency
            // group (keyed on PR_NUMBER). Cancelling by branch here would also kill
            // other fork PRs, which all dispatch on the shared base ref.

            // Snapshot latest run ID before dispatch
            const { data: before } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'build-manual.yml', branch: dispatchRef, per_page: 1,
            });
            const prevId = before.workflow_runs[0]?.id || 0;

            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'build-manual.yml',
              ref: dispatchRef,
              inputs: {
                LOCATION: devOnly ? 'dev-only' : allArch ? 'all' : 'linux-amd64',
                EVERYTHING: everything.toString(),
                BUGFIX: bugfix.toString(),
                CORPUS: corpus.toString(),
                BIGLAKE: biglake.toString(),
                DUCKDB_SANITIZERS: duckdbSanitizers.toString(),
                IRESEARCH_SANITIZERS: iresearchSanitizers.toString(),
                PR_SHA: sha,
                PR_NUMBER: String(context.payload.issue.number),
                BUILD_CONFIG: JSON.stringify({
                  TRIGGERED_BY: context.actor,
                  PR_SHA: sha,
                  PR_BRANCH: branch,
                  PR_STATUS_CONTEXT: statusContext,
                  FLAKY_RUNS: flakyRuns,
                }),
              },
            });

            // Wait for the new run to appear (up to 30s)
            let runUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/build-manual.yml?query=branch%3A${encodeURIComponent(dispatchRef)}`;
            for (let i = 0; i < 6; i++) {
              await new Promise(r => setTimeout(r, 5000));
              const { data: after } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'build-manual.yml', branch: dispatchRef, per_page: 3,
              });
              const run = after.workflow_runs.find(r => r.id > prevId);
              if (run) {
                runUrl = run.html_url;
                break;
              }
            }

            // Update pending status with run URL so the check is clickable in PR
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              description: 'Build in progress',
              context: statusContext,
              target_url: runUrl,
            });

            const opts = [
              allArch && 'all architectures',
              biglake && 'biglake',
              bugfix && 'bugfix',
              corpus && 'corpus',
              devOnly && 'dev only',
              duckdbSanitizers && 'duckdb sanitizers',
              everything && 'everything',
              iresearchSanitizers && 'iresearch sanitizers',
            ].filter(Boolean);
            const optsStr = opts.length > 0 ? opts.join(', ') : 'default';
            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC';
            const latest = `\n\n<!-- ci-latest -->**Latest:** ${optsStr} · [View Run](${runUrl}) · ${timestamp}`;
            const section = /\n\n<!-- ci-(data:.*?|latest) -->[\s\S]*$/;
            const { data: current } = await github.rest.issues.getComment({ owner, repo, comment_id: comment.id });
            let updatedBody = current.body.replace('- [x] **Trigger Jobs**', '- [ ] **Trigger Jobs**');
            updatedBody = section.test(updatedBody) ? updatedBody.replace(section, latest) : updatedBody + latest;
            await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body: updatedBody });
