name: serenedb | make release

run-name: "serenedb | make release [${{ inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && 'amd64+arm64' || inputs.BUILD_AMD64 && 'amd64' || inputs.BUILD_ARM64 && 'arm64' || 'none' }}]"

on:
  workflow_dispatch:
    inputs:
      SERENEDB_VERSION_PATCH:
        description: 'Patch number N, or N.M for a hotfix on top of patch N (e.g. 1.1). Leave empty to auto-increment.'
        required: false
        type: string
        default: ''
      RTA:
        description: 'RTA mode: off, test (warn on failure), required (block push/release on failure)'
        required: true
        type: choice
        options:
          - required
          - test
          - off
        default: required
      PUSH_IMAGES_2_REGISTRY:
        description: 'Push Docker images to Docker Hub'
        required: true
        type: boolean
        default: false
      CREATE_GITHUB_RELEASE:
        description: 'Create a GitHub Release draft'
        required: true
        type: boolean
        default: false
      DOCKER_EXTRA_TAGS:
        description: 'Optional extra Docker tags (comma-separated)'
        required: false
        type: string
        default: ''
      BUILD_AMD64:
        description: 'Build for amd64'
        required: true
        type: boolean
        default: true
      BUILD_ARM64:
        description: 'Build for arm64'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      SERENEDB_VERSION_PATCH:
        type: string
        required: false
        default: ''
      RTA:
        type: string
        required: false
        default: required
      PUSH_IMAGES_2_REGISTRY:
        type: boolean
        required: false
        default: false
      CREATE_GITHUB_RELEASE:
        type: boolean
        required: false
        default: false
      DOCKER_EXTRA_TAGS:
        type: string
        required: false
        default: ''
      BUILD_AMD64:
        type: boolean
        required: false
        default: true
      BUILD_ARM64:
        type: boolean
        required: false
        default: true

permissions:
  statuses: write
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      patch: ${{ steps.version.outputs.patch }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Resolve version patch
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(date -u +%y)
          MINOR=$(date -u +%m)
          PATCH="${{ inputs.SERENEDB_VERSION_PATCH }}"
          if [[ -z "$PATCH" ]]; then
            LAST=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft \
              --jq "[.[] | select(.isDraft | not) | .tagName | ltrimstr(\"v\") | select(startswith(\"${MAJOR}.${MINOR}.\")) | ltrimstr(\"${MAJOR}.${MINOR}.\") | select(test(\"^[0-9]+\")) | split(\"-\")[0] | split(\".\")[0]] | map(tonumber) | max // 0" \
              2>/dev/null || echo "0")
            PATCH=$(( LAST + 1 ))
          fi
          if [[ ! "$PATCH" =~ ^[1-9][0-9]*(\.[1-9][0-9]*)?$ ]]; then
            echo "SERENEDB_VERSION_PATCH must be N or N.M, both > 0, got '$PATCH'" >&2
            exit 1
          fi
          {
            echo "patch=$PATCH"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
          } >> "$GITHUB_OUTPUT"

  build-amd64:
    if: inputs.BUILD_AMD64
    needs: [resolve-version]
    uses: ./.github/workflows/make-package.yml
    with:
      LOCATION: linux-amd64
      RTA: ${{ inputs.RTA }}
      UPLOAD_ARTIFACTS: true
      PUSH_IMAGE: ${{ inputs.PUSH_IMAGES_2_REGISTRY }}
      SERENEDB_VERSION_PATCH: ${{ needs.resolve-version.outputs.patch }}
    secrets: inherit

  build-arm64:
    if: inputs.BUILD_ARM64
    needs: [resolve-version]
    uses: ./.github/workflows/make-package.yml
    with:
      LOCATION: linux-arm64
      RTA: ${{ inputs.RTA }}
      UPLOAD_ARTIFACTS: true
      PUSH_IMAGE: ${{ inputs.PUSH_IMAGES_2_REGISTRY }}
      SERENEDB_VERSION_PATCH: ${{ needs.resolve-version.outputs.patch }}
    secrets: inherit

  release:
    name: Docker & Release
    needs: [resolve-version, build-amd64, build-arm64]
    if: >-
      always() && !cancelled() &&
      (needs.build-amd64.outputs.packages_ok == 'true' || needs.build-arm64.outputs.packages_ok == 'true')
    runs-on:
      - linux-amd64
      - lan
    permissions:
      contents: write
    env:
      SDB_STORE_HOST: ${{ secrets.SDB_STORE_HOST }}

    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          clean: true

      - name: Init test runner submodule
        run: git submodule update --init --depth 1 third_party/sqllogictest-rs

      - name: Set version
        run: |
          PATCH="${{ needs.resolve-version.outputs.patch }}"
          MAJOR="${{ needs.resolve-version.outputs.major }}"
          MINOR="${{ needs.resolve-version.outputs.minor }}"
          {
            echo "SERENEDB_VERSION_PATCH=$PATCH"
            echo "DOCKER_TAG=${MAJOR}.${MINOR}.${PATCH}"
          } >> "$GITHUB_ENV"

      - name: Download amd64 packages
        if: needs.build-amd64.outputs.packages_ok == 'true'
        run: python3 scripts/ci/ci.py download artifacts/packages-linux-amd64 "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" serenedb packages/linux-amd64/

      - name: Download arm64 packages
        if: needs.build-arm64.outputs.packages_ok == 'true'
        run: python3 scripts/ci/ci.py download artifacts/packages-linux-arm64 "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" serenedb packages/linux-arm64/

      - name: Check the architectures
        id: check
        env:
          RTA: ${{ inputs.RTA }}
          PUSH: ${{ inputs.PUSH_IMAGES_2_REGISTRY }}
          WANT_AMD64: ${{ inputs.BUILD_AMD64 }}
          WANT_ARM64: ${{ inputs.BUILD_ARM64 }}
          AMD64_PACKAGES: ${{ needs.build-amd64.outputs.packages_ok }}
          ARM64_PACKAGES: ${{ needs.build-arm64.outputs.packages_ok }}
          AMD64_RTA: ${{ needs.build-amd64.outputs.rta_ok }}
          ARM64_RTA: ${{ needs.build-arm64.outputs.rta_ok }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.image_digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.image_digest }}
        run: |
          ready=true
          digests=()
          for arch in AMD64 ARM64; do
            want="WANT_$arch" packages="${arch}_PACKAGES" rta="${arch}_RTA" digest="${arch}_DIGEST"
            [[ "${!want}" == true ]] || continue
            if [[ "${!packages}" != true ]]; then
              echo "::error::${arch,,} has no packages"
              ready=false
              continue
            fi
            if [[ "$RTA" == required && "${!rta}" != true ]]; then
              echo "::error::${arch,,} failed its RTA"
              ready=false
            fi
            if [[ "$PUSH" == true && -z "${!digest}" ]]; then
              echo "::error::${arch,,} pushed no image"
              ready=false
            fi
            [[ -z "${!digest}" ]] || digests+=("${!digest}")
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "digests=${digests[*]}" >> "$GITHUB_OUTPUT"

      - name: Prepare packages
        run: |
          mkdir -p release-packages
          find packages/ -name "serenedb*.deb" -exec cp {} release-packages/ \;
          find packages/ -name "serenedb-*.tar.gz" -exec cp {} release-packages/ \;
          echo "Available release packages:"
          ls -la release-packages/

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.16.4'

      - name: Build helm chart
        run: |
          bash packages/stamp_helm_version.bash "${DOCKER_TAG}"
          bash packages/build_helm.bash
          CHART=$(find packages/helm/out -maxdepth 1 -name 'serenedb-*.tgz' | head -1)
          [ -n "$CHART" ] || { echo "no packaged helm chart found" >&2; exit 1; }
          cp "$CHART" release-packages/
          echo "CHART_FILE=$(basename "$CHART")" >> "$GITHUB_ENV"

      - name: Publish the image
        if: inputs.PUSH_IMAGES_2_REGISTRY && steps.check.outputs.ready == 'true'
        env:
          DOCKER_REGISTRY: serenedb
          DOCKER_USERNAME: serenedb
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_EXTRA_TAGS: ${{ inputs.DOCKER_EXTRA_TAGS }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          IMAGE_DIGESTS: ${{ steps.check.outputs.digests }}
        run: ./packages/push_docker.bash

      - name: Create GitHub Release
        if: inputs.CREATE_GITHUB_RELEASE && steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          CHART_FILE: ${{ env.CHART_FILE }}
        run: |
          TAG="v${DOCKER_TAG}"
          TITLE="SereneDB ${TAG}"
          BODY="Docker image: https://hub.docker.com/r/serenedb/serenedb/tags?name=${DOCKER_TAG}

          Helm chart:
          \`\`\`
          helm install mydb \\
            https://github.com/${{ github.repository }}/releases/download/${TAG}/${CHART_FILE}
          \`\`\`"

          ASSETS=()
          for f in release-packages/*.deb release-packages/*.tar.gz release-packages/*.tgz; do
            [ -e "$f" ] && ASSETS+=("$f")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No packages found, skipping GitHub release"
            exit 1
          fi

          EXISTING=$(gh release view "${TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [[ "$EXISTING" == "true" ]]; then
            echo "Replacing existing draft release ${TAG}"
            gh release delete "${TAG}" --yes
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}" 2>/dev/null || true
          elif [[ "$EXISTING" == "false" ]]; then
            echo "::error::Release ${TAG} already exists and is published; refusing to overwrite"
            exit 1
          fi

          gh release create "${TAG}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "${TITLE}" \
            --notes "${BODY}" \
            "${ASSETS[@]}"

      - name: Send notification
        if: always() && !cancelled()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID_MAIN: "51"
          TG_THREAD_ID_BUILD: "53"
          TG_USER_MAP: ${{ secrets.TG_USER_MAP }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: >-
            ${{
              job.status != 'success' && 'failure'
              || (
                (needs.build-amd64.result == 'success' || needs.build-amd64.result == 'skipped') &&
                (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
                  && 'success'
                  || (needs.build-amd64.outputs.packages_ok == 'true' || needs.build-arm64.outputs.packages_ok == 'true')
                    && 'warning'
                    || 'failure'
              )
            }}
          ACTOR: ${{ github.actor }}
          RUN_NAME: "serenedb | make release"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send_notification.bash

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"
