name: task | validate pg tests

on:
  workflow_dispatch:
    inputs:
      LOCATION:
        description: "Runner label"
        type: string
        required: false
        default: "linux-amd64"
      PR_SHA:
        description: "Commit SHA to checkout (empty = workflow ref)"
        type: string
        required: false
        default: ""
      PR_NUMBER:
        description: "PR number, recorded with the results"
        type: string
        required: false
        default: ""
      CHANGED:
        description: "Only the pg tests the diff against main changes"
        type: boolean
        required: false
        default: false
      CORPUS:
        description: "Also validate the sqlite corpus (tests/sqllogic/any/pg/sqlite)"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      LOCATION:
        description: "Runner label"
        type: string
        required: false
        default: "linux-amd64"
      PR_SHA:
        description: "Commit SHA to checkout (fork PR support; empty = workflow ref)"
        type: string
        required: false
        default: ""
      PR_NUMBER:
        description: "PR number, recorded with the results"
        type: string
        required: false
        default: ""
      CHANGED:
        description: "Only the pg tests the diff against main changes"
        type: boolean
        required: false
        default: false
      CORPUS:
        description: "Also validate the sqlite corpus (tests/sqllogic/any/pg/sqlite)"
        type: boolean
        required: false
        default: false

env:
  SDB_STORE_HOST: ${{ secrets.SDB_STORE_HOST }}
  SDB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  SDB_SHA: ${{ inputs.PR_SHA || github.sha }}
  SDB_PR: ${{ inputs.PR_NUMBER }}
  SDB_BRANCH: ${{ inputs.PR_NUMBER == '' && github.ref_name || '' }}

jobs:
  validate:
    name: "validate-pg-tests"
    runs-on:
      - ${{ inputs.LOCATION }}
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Reap containers left on this runner
        run: |
          echo "SDB_DOCKER_OWNER=ci-${RUNNER_NAME}" >> "$GITHUB_ENV"
          filter="label=serenedb.owner=ci-${RUNNER_NAME}"
          docker ps -a --filter "$filter" --format '{{.Names}}' | xargs -r docker rm -fv || true
          docker network ls --filter "$filter" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "$filter" --format '{{.Name}}' | xargs -r docker volume rm || true
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PR_SHA || github.sha }}
          fetch-depth: 1
          submodules: false
          clean: false

      - name: Clean the checkout
        run: |
          docker run --rm ${SDB_DOCKER_OWNER:+--label "serenedb.owner=$SDB_DOCKER_OWNER"} -v "$PWD:/w" alpine:3.22 rm -rf /w/out
          git clean -ffdxq
          git submodule update --init --depth=1 third_party/sqllogictest-rs
          git fetch -q --no-tags --depth=1000 origin main "$(git rev-parse HEAD)"

      - name: Run the pg tests against PostgreSQL
        env:
          CHANGED: ${{ inputs.CHANGED }}
          CORPUS: ${{ inputs.CORPUS }}
        run: |
          args=(--suite postgres --relabel 0)
          [[ "$CHANGED" != true ]] || args+=(--changed origin/main --only-changed)
          [[ "$CORPUS" != true ]] || args+=(--corpus)
          SDB_CHECK=pg ./scripts/ci/run_shard.sh perf - 1/1 - "${args[@]}"

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-pg-${{ inputs.LOCATION }}
          path: |
            out/test-*/results.jsonl
            out/test-*/summary.txt
            out/test-*/meta.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-pg-${{ inputs.LOCATION }}
          path: out/failure-*.tar.zst
          if-no-files-found: ignore
          retention-days: 14

      - name: Reap containers of this job
        if: always()
        run: ./scripts/ci/reap_owned_docker.sh "$SDB_DOCKER_OWNER"
