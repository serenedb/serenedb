apiVersion: v2
name: serenedb
description: SereneDB single-node database server
type: application
# version/appVersion are placeholders: real values are stamped at release time
# by CI (release.yml) -- both set to the SereneDB version being shipped, and
# the packaged chart is attached as an asset of that GitHub release.
# appVersion "latest" keeps `helm install` from a source checkout working
# (image.tag defaults to appVersion).
version: 0.0.0
appVersion: "latest"
kubeVersion: ">=1.25.0-0"
home: https://serenedb.com
sources:
  - https://github.com/serenedb/serenedb
keywords:
  - database
  - sql
  - postgres
  - analytics
  - search
maintainers:
  - name: SereneDB GmbH
    email: support@serenedb.com
