x-owner: &owner
  serenedb.owner: ${SDB_DOCKER_OWNER:-none}

services:
  # Make the root:root 0755 named volume world-writable before the non-root
  # services use /test-tmp (the release image's serenedb user can't create dirs
  # in a fresh root-owned volume).
  test-tmp-init:
    image: ${BUILD_IMAGE}
    labels: *owner
    user: "0:0"
    volumes:
      - "sdb-test-tmp:/test-tmp"
    command: ["sh", "-c", "chmod 0777 /test-tmp"]

  serenedb:
    image: ${DOCKER_TEST_IMAGE}
    labels: *owner
    depends_on:
      test-tmp-init:
        condition: service_completed_successfully
    command: serened --auth_timeout=600s
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Read-only view of the workspace so fixture symlinks under /test-tmp
      # (targets like /workspace/resources/tests/iceberg/...) resolve.
      - "${WORKSPACE}:/workspace:ro"
      - "sdb-test-tmp:/test-tmp"
    networks:
      - rta-network

  # HBA network tests: the mask test launches its OWN serened and connects from
  # different 127.x source addresses, so client and server must share a
  # container -- it cannot use the networked `serenedb` service.
  network-tests:
    image: ${BUILD_IMAGE}
    labels: *owner
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - "${WORKSPACE}:/workspace:ro"
    environment:
      - SERENED=/workspace/out/docker-rta-serened
    command: ["/workspace/tests/drivers/network/run.sh"]

  tests:
    image: ${BUILD_IMAGE}
    labels: *owner
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      - serenedb
    volumes:
      - "${WORKSPACE}:/workspace"
      - "sdb-test-tmp:/test-tmp"
      - "${CARGO_TARGET_CACHE:-${HOME}/.cache/serenedb-cargo-target}:/cargo-target"
      - "${CARGO_HOME_CACHE:-${HOME}/.cache/serenedb-cargo-home}:/cargo-home"
    environment:
      - HOME=/tmp
      - SDB_TEST_TMP_ROOT=/test-tmp
      - SLT_TEST_DIR_SHARED=1
      - CARGO_HOME=/cargo-home
      - CARGO_TARGET_DIR=/cargo-target
    networks:
      - rta-network
    command: >
      sh -c '
        echo "Waiting for serened to accept connections..." &&
        for i in $(seq 1 60); do
          pg_isready -h serenedb -p 7890 -U postgres -q 2>/dev/null && break
          sleep 1
        done &&
        pg_isready -h serenedb -p 7890 -U postgres &&
        exec python3 /workspace/scripts/ci/test.py --server serenedb:7890 --suite sqllogic --fast \
          --exclude "sqllogic:*text_tokenizer*" --exclude "sqllogic:*log_level*" \
          --exclude "sqllogic:*pg_typeof*" --out /workspace/out/test-docker-rta
      '

networks:
  default:
    labels: *owner
  rta-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}_rta-network
    labels: *owner

volumes:
  sdb-test-tmp:
    labels: *owner
