  pg_typname: timestamp
  text: true
  binary: true
  array: true
  samples:
    - "1970-01-01 00:00:00"
    - "2000-01-01 00:00:00"
    - "2026-05-05 12:34:56.789012"
    - null

- oid: 1184
  name: timestamptz
  pg_typname: timestamptz
  text: true
  binary: true
  array: true
  samples:
